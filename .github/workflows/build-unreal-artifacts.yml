name: Build Unreal artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: territory-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: UE ${{ matrix.unreal }} / Win64
    strategy:
      fail-fast: false
      matrix:
        include:
          - unreal: "5.7"
            runner_label: ue-5.7
          - unreal: "5.8"
            runner_label: ue-5.8

    runs-on:
      - self-hosted
      - Windows
      - X64
      - ${{ matrix.runner_label }}
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      UE_VERSION: ${{ matrix.unreal }}

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Resolve and verify Unreal Engine
        run: |
          $candidates = @()
          if ($env:UE_ROOT) {
            $candidates += $env:UE_ROOT
          }
          $candidates += @(
            "C:\Program Files\Epic Games\UE_$env:UE_VERSION",
            "D:\Program Files\Epic Games\UE_$env:UE_VERSION"
          )

          $engineRoot = $candidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) } |
            Select-Object -First 1
          if (-not $engineRoot) {
            throw "Unreal Engine $env:UE_VERSION was not found. Set UE_ROOT on the ${{ matrix.runner_label }} runner."
          }

          $versionFile = Join-Path $engineRoot "Engine\Build\Build.version"
          if (-not (Test-Path -LiteralPath $versionFile -PathType Leaf)) {
            throw "Unreal Build.version is missing: $versionFile"
          }
          $version = Get-Content -LiteralPath $versionFile -Raw | ConvertFrom-Json
          $actualVersion = "$($version.MajorVersion).$($version.MinorVersion)"
          if ($actualVersion -ne $env:UE_VERSION) {
            throw "Runner label expects UE $env:UE_VERSION but UE_ROOT contains UE $actualVersion."
          }

          $uat = Join-Path $engineRoot "Engine\Build\BatchFiles\RunUAT.bat"
          if (-not (Test-Path -LiteralPath $uat -PathType Leaf)) {
            throw "RunUAT.bat is missing: $uat"
          }

          "UE_ROOT=$engineRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Verified Unreal Engine $actualVersion at $engineRoot"

      - name: Verify Narrative Pro dependency
        run: |
          $narrativeDescriptor = Get-ChildItem `
            -LiteralPath (Join-Path $env:UE_ROOT "Engine\Plugins") `
            -Filter "NarrativePro.uplugin" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $narrativeDescriptor) {
            throw "Narrative Pro is required to compile TerritoryFramework. Install the licensed plugin under this runner's Engine/Plugins directory."
          }
          "Narrative Pro: $($narrativeDescriptor.FullName)"

      - name: Build packaged plugin
        id: package
        run: |
          $pluginDescriptor = Join-Path $env:GITHUB_WORKSPACE "TerritoryFramework.uplugin"
          if (-not (Test-Path -LiteralPath $pluginDescriptor -PathType Leaf)) {
            throw "TerritoryFramework.uplugin was not found in the checkout."
          }

          $buildDirectory = Join-Path $env:RUNNER_TEMP ("TF-" + [guid]::NewGuid().ToString('N'))
          & (Join-Path $env:GITHUB_WORKSPACE 'Tools/Build-Release.ps1') `
            -EngineRoot $env:UE_ROOT -PluginSource $env:GITHUB_WORKSPACE -OutputRoot $buildDirectory
          $packageDirectory = Join-Path $buildDirectory 'Package/TerritoryFramework'
          $env:TF_RELEASE_REPORT = Join-Path $packageDirectory 'CONTENT_VALIDATION.json'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          & $editor (Join-Path $buildDirectory 'HostProject/HostProject.uproject') `
            -run=pythonscript "-script=$env:GITHUB_WORKSPACE/Tools/Validate-Content.py" `
            -DDC=InstalledNoZenLocalFallback -unattended -nullrhi -nosplash -nop4
          if ($LASTEXITCODE -ne 0) { throw 'Included content failed its clean-project check.' }
          $content = Get-Content -LiteralPath $env:TF_RELEASE_REPORT -Raw | ConvertFrom-Json
          if ($content.errors -ne 0 -or $content.assets_checked -ne 118 -or $content.external_dependencies.Count -ne 0) {
            throw 'The content report did not pass.'
          }
          @{
            plugin_version = (Get-Content -LiteralPath $pluginDescriptor -Raw | ConvertFrom-Json).VersionName
            unreal_version = $content.engine_version
            narrative_pro_version = '2.4.2'
            platform = 'Win64'
            commit = $env:GITHUB_SHA
            workflow_run = $env:GITHUB_RUN_ID
            builds = @('Editor Development', 'Game Development', 'Game Shipping')
            assets_checked = $content.assets_checked
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $packageDirectory 'BUILD_INFO.json') -Encoding utf8
          "package_directory=$packageDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload UE ${{ matrix.unreal }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerritoryFramework-UE${{ matrix.unreal }}-Win64
          path: ${{ steps.package.outputs.package_directory }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
